name: APK 빌드

# 깃허브에서 릴리스를 발행하면(태그 예: v5.9.1) 자동으로 APK를 만들어 그 릴리스에 붙인다.
# 폰의 앱은 켤 때 최신 릴리스를 확인해 설치할지 묻는다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 5.9.1)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 필요한 두 개만 받는다 (기본값은 더 이상 없는 'tools' 패키지를 받으려다 실패했었다)
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 서명 키 복원
        run: |
          mkdir -p build
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > build/mabed.jks
          test -s build/mabed.jks

      - name: 버전 정하기
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "v=${V#v}" >> $GITHUB_OUTPUT

      # 릴리스 태그와 AndroidManifest 의 versionName 이 다르면 멈춘다
      # (다르면 폰이 '새 버전'이라고 받았는데 설치해 보니 옛 버전인 일이 생긴다)
      - name: 버전 일치 확인
        run: |
          M=$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)
          echo "태그 ${{ steps.ver.outputs.v }} / 매니페스트 $M"
          [ "$M" = "${{ steps.ver.outputs.v }}" ] || { echo "::error::릴리스 태그와 AndroidManifest versionName 이 다릅니다"; exit 1; }

      - name: 빌드
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: ./build.sh "${{ steps.ver.outputs.v }}"

      - name: 확인
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging \
            "build/mabed-${{ steps.ver.outputs.v }}.apk" | head -3

      - name: 릴리스에 붙이기
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/mabed-${{ steps.ver.outputs.v }}.apk

      - name: 결과물 보관
        uses: actions/upload-artifact@v7
        with:
          name: mabed-${{ steps.ver.outputs.v }}
          path: build/mabed-${{ steps.ver.outputs.v }}.apk
